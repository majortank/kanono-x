<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- CRT Screen Gradients -->
    <radialGradient id="crtGlass" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#142818"/>
      <stop offset="70%" stop-color="#0a140c"/>
      <stop offset="100%" stop-color="#040805"/>
    </radialGradient>
    <linearGradient id="crtBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a382e"/>
      <stop offset="50%" stop-color="#1a221c"/>
      <stop offset="100%" stop-color="#0d120f"/>
    </linearGradient>
    <filter id="phosphorGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="18" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Monitor Bezel (Vintage CRT monitor body) -->
  <rect x="24" y="24" width="464" height="464" rx="36" ry="36" fill="url(#crtBezel)" stroke="#384f3e" stroke-width="6"/>

  <!-- Screen Glass with CRT Curvature -->
  <rect x="52" y="52" width="408" height="408" rx="28" ry="28" fill="url(#crtGlass)" stroke="#22c55e" stroke-width="2" stroke-opacity="0.4"/>

  <!-- CRT Scanlines Overlay -->
  <g opacity="0.15">
    <line x1="52" y1="80" x2="460" y2="80" stroke="#000" stroke-width="2"/>
    <line x1="52" y1="100" x2="460" y2="100" stroke="#000" stroke-width="2"/>
    <line x1="52" y1="120" x2="460" y2="120" stroke="#000" stroke-width="2"/>
    <line x1="52" y1="140" x2="460" y2="140" stroke="#000" stroke-width="2"/>
    <line x1="52" y1="160" x2="460" y2="160" stroke="#000" stroke-width="2"/>
    <line x1="52" y1="180" x2="460" y2="180" stroke="#000" stroke-width="2"/>
    <line x1="52" y1="200" x2="460" y2="200" stroke="#000" stroke-width="2"/>
    <line x1="52" y1="220" x2="460" y2="220" stroke="#000" stroke-width="2"/>
    <line x1="52" y1="240" x2="460" y2="240" stroke="#000" stroke-width="2"/>
    <line x1="52" y1="260" x2="460" y2="260" stroke="#000" stroke-width="2"/>
    <line x1="52" y1="280" x2="460" y2="280" stroke="#000" stroke-width="2"/>
    <line x1="52" y1="300" x2="460" y2="300" stroke="#000" stroke-width="2"/>
    <line x1="52" y1="320" x2="460" y2="320" stroke="#000" stroke-width="2"/>
    <line x1="52" y1="340" x2="460" y2="340" stroke="#000" stroke-width="2"/>
    <line x1="52" y1="360" x2="460" y2="360" stroke="#000" stroke-width="2"/>
    <line x1="52" y1="380" x2="460" y2="380" stroke="#000" stroke-width="2"/>
    <line x1="52" y1="400" x2="460" y2="400" stroke="#000" stroke-width="2"/>
    <line x1="52" y1="420" x2="460" y2="420" stroke="#000" stroke-width="2"/>
    <line x1="52" y1="440" x2="460" y2="440" stroke="#000" stroke-width="2"/>
  </g>

  <!-- Glowing Turntable Stylus & Vinyl -->
  <circle cx="256" cy="230" r="110" fill="#0d1a10" stroke="#22c55e" stroke-width="4" stroke-dasharray="8 6" opacity="0.8"/>
  <circle cx="256" cy="230" r="75" fill="#060c08" stroke="#4ade80" stroke-width="2" opacity="0.6"/>
  <circle cx="256" cy="230" r="26" fill="#22c55e" filter="url(#phosphorGlow)"/>
  <circle cx="256" cy="230" r="8" fill="#ffffff"/>

  <!-- Iconic Phosphor 'X' Logo Mark -->
  <g filter="url(#phosphorGlow)">
    <!-- Stylized Futuristic 'X' -->
    <path d="M160 130 L220 230 L150 330 L195 330 L245 255 L295 330 L340 330 L270 230 L330 130 L285 130 L245 195 L205 130 Z" 
          fill="#4ade80" stroke="#22c55e" stroke-width="4"/>
  </g>

  <!-- Soundwave Spectrum Visualizer at Bottom -->
  <g fill="#22c55e" filter="url(#phosphorGlow)" opacity="0.85">
    <rect x="90" y="380" width="8" height="24" rx="2"/>
    <rect x="106" y="365" width="8" height="39" rx="2"/>
    <rect x="122" y="350" width="8" height="54" rx="2"/>
    <rect x="138" y="370" width="8" height="34" rx="2"/>
    <rect x="154" y="340" width="8" height="64" rx="2"/>
    <rect x="170" y="330" width="8" height="74" rx="2"/>
    <rect x="186" y="345" width="8" height="59" rx="2"/>
    <rect x="202" y="360" width="8" height="44" rx="2"/>
    <rect x="218" y="320" width="8" height="84" rx="2"/>
    <rect x="234" y="310" width="8" height="94" rx="2"/>
    <rect x="250" y="300" width="8" height="104" rx="2"/>
    <rect x="266" y="315" width="8" height="89" rx="2"/>
    <rect x="282" y="335" width="8" height="69" rx="2"/>
    <rect x="298" y="325" width="8" height="79" rx="2"/>
    <rect x="314" y="350" width="8" height="54" rx="2"/>
    <rect x="330" y="340" width="8" height="64" rx="2"/>
    <rect x="346" y="365" width="8" height="39" rx="2"/>
    <rect x="362" y="355" width="8" height="49" rx="2"/>
    <rect x="378" y="375" width="8" height="29" rx="2"/>
    <rect x="394" y="385" width="8" height="19" rx="2"/>
    <rect x="410" y="390" width="8" height="14" rx="2"/>
  </g>

  <!-- Typography: KANONO X ADVANCED -->
  <text x="256" y="445" font-family="monospace, monospace" font-size="20" font-weight="900" fill="#86efac" text-anchor="middle" letter-spacing="4" filter="url(#phosphorGlow)">
    KANONO X • ADVANCED
  </text>
</svg>
